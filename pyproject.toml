[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armadillo-sentinel"
version = "0.1.0"
description = "Analisador de logs que detecta comportamentos suspeitos"
requires-python = ">=3.10"
dependencies = ["pandas", "psycopg2-binary", "python-dotenv", "streamlit"]

[project.scripts]
sentinel = "armadillo_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
